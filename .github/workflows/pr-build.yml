name: PR Build

on:
  pull_request:
    branches:
      - neoforge-1.21.1
      - forge-1.20.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出 PR 合并结果
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ github.base_ref == 'forge-1.20.1' && '17' || '21' }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14.3'
          # 仅运行 PR 时也写入缓存，供该 PR 的后续构建复用。
          cache-read-only: false

      # 只验证构建，不上传 jar，也不创建或修改 Release。
      # build 经 check 真实执行 10 个 main() 自检；自检失败即本步骤失败。
      - name: 编译与打包检查
        run: gradle --no-daemon --console=plain --stacktrace build

      - name: 检查正式产物不含测试内容
        run: |
          set -euo pipefail
          jar="$(find build/libs -maxdepth 1 -name 'tlm-self-talk-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$jar"
          if unzip -l "$jar" | grep -E '(^|[/ ])(ciTest|citest|maid_self_talk_ci)(/| |$)' ; then
            echo "正式 jar 包含 CI 测试内容: $jar"
            exit 1
          fi

  ci2-neoforge:
    name: CI 2 / NeoForge Runtime
    needs: build
    if: github.base_ref == 'neoforge-1.21.1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出 PR 合并结果
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 安装无头图形与音频运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libgl1 libxi6 libxrender1 libxtst6 \
            libopenal1 libxrandr2 libxinerama1 libxcursor1 libpulse0

      - name: 真实专服 + 双客户端链路测试
        env:
          ALSOFT_DRIVERS: null
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          GALLIUM_DRIVER: llvmpipe
          CI: 'true'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 ci/runtime/runner.py run \
              --loader neoforge --suite all --gradle gradle --run-id "ci2-neoforge-${GITHUB_RUN_ID}"

      - name: 上传运行报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-neoforge-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-runtime/**/report/**
          if-no-files-found: ignore
          retention-days: 7
