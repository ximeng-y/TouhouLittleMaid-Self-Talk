name: PR Build

on:
  pull_request:
    branches:
      - neoforge-1.21.1
      - forge-1.20.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出 PR 合并结果
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ github.base_ref == 'forge-1.20.1' && '17' || '21' }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14.3'
          # 仅运行 PR 时也写入缓存，供该 PR 的后续构建复用。
          cache-read-only: false

      # 只验证构建，不上传 jar，也不创建或修改 Release。
      - name: 编译与打包检查
        run: gradle --no-daemon --console=plain --stacktrace build
