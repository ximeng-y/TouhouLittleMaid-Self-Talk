plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'com.maidmod'
// jar 文件名后缀区分双分支：main 为 NeoForge 1.21.1 线（1.20.1 分支为 -forge-1.20.1）
version = '1.3.1-neoforge-1.21.1'

base {
    archivesName = 'tlm-self-talk'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // 东方小女仆（TLM）1.5.3 NeoForge 1.21.1，核心依赖
    implementation 'maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1'
    // Cloth Config（仅编译期：客户端配置界面类引用其 API；
    // 运行时通过反射注册，未安装 cloth-config 时配置界面自动禁用，不影响模组功能）
    compileOnly 'maven.modrinth:cloth-config:15.0.140+neoforge'
}

neoForge {
    version = '21.1.219'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        maid_self_talk {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'   : 'tlm-self-talk',
                'Specification-Version' : '1.3.1',
                'Implementation-Title'  : 'TLM Self-Talk',
                'Implementation-Version': '1.3.1',
        ])
    }
}

// ===== 自检真实执行（issue #60 C13）：四个 main() 自检 + TLM 兼容自检挂到 check，
// gradle build / CI 自动运行，失败（非零退出或异常）即构建失败 =====
def selfCheckMains = ['EnvironmentContextTest', 'EnvironmentContextRendererTest',
                      'HistoryCoreTest', 'SelfTalkEventBufferTest', 'TlmMixinTargetTest']
selfCheckMains.each { name ->
    tasks.register("selfCheck${name}", JavaExec) {
        group = 'verification'
        description = "运行自检 main：com.maidmod.selftalk.${name}"
        // 并入 main 的 runtimeClasspath：MDG 只把 neoforge 平台库（含 gson）接到 main 源集，
        // testRuntimeClasspath 仅继承 implementation；HistoryCoreTest 运行需要的 gson 来自
        // Minecraft 依赖树（neoforge 传递依赖 gson 2.10.1）
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = "com.maidmod.selftalk.${name}"
        jvmArgs '-Dfile.encoding=UTF-8'
    }
}
tasks.named('check') {
    dependsOn selfCheckMains.collect { "selfCheck${it}" }
}
