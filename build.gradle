plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'com.maidmod'
// jar 文件名后缀区分双分支：main 为 NeoForge 1.21.1 线（1.20.1 分支为 -forge-1.20.1）
version = '1.0.3-neoforge-1.21.1'

base {
    archivesName = 'tlm-self-talk'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    // 东方小女仆（TLM）1.5.3 NeoForge 1.21.1，核心依赖
    implementation 'maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1'
    // Cloth Config（仅编译期：客户端配置界面类引用其 API；
    // 运行时通过反射注册，未安装 cloth-config 时配置界面自动禁用，不影响模组功能）
    compileOnly 'maven.modrinth:cloth-config:15.0.140+neoforge'
}

neoForge {
    version = '21.1.219'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        maid_self_talk {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'   : 'tlm-self-talk',
                'Specification-Version' : '1.0.3',
                'Implementation-Title'  : 'TLM Self-Talk',
                'Implementation-Version': '1.0.3',
        ])
    }
}
