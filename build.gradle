buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

group = 'com.maidmod'
// jar 文件名后缀区分双分支：1.20.1 Forge 线（main 分支为 -neoforge-1.21.1）
version = '1.4.0-forge-1.20.1'
base { archivesName = 'tlm-self-talk' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: '2023.08.20-1.20.1'
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { maid_self_talk { source sourceSets.main } }
        }
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

mixin {
    add sourceSets.main, "maid_self_talk.refmap.json"
    config "maid_self_talk.mixins.json"
}

repositories {
    // SnakeYAML（预制复用 YAML 头解析，见 dependencies）
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'IllusiveC4'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
    // 必须 fg.deobf：Modrinth 1.20.1 发布物是 SRG 名，不 deobf 编译不过
    implementation fg.deobf('maven.modrinth:touhou-little-maid:1.5.3-forge+mc1.20.1')
    compileOnly fg.deobf('maven.modrinth:cloth-config:11.1.136+forge')
    // Curios API（仅编译期：饰品读取类引用其 API，运行时不打包、不声明前置；
    // 未安装 Curios 时功能门拦截，不加载读取实现，不影响模组功能）
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    // SnakeYAML：预制复用 YAML 头解析（本项目第一个打包依赖）。implementation 供编译与自检运行时；
    // jarJar 配置把它嵌套进产物 jar（META-INF/jarjar 元数据，ModLauncher 自动加载），
    // 运行者照旧只装本 mod 一个 jar，无新增前置。FG6 的 jarJar 依赖要求 maven 版本区间写法
    implementation 'org.yaml:snakeyaml:2.2'
    jarJar 'org.yaml:snakeyaml:[2.2,2.3)'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 启用 FG6 的 jarJar：产物 jar 改为 jarJar 任务产出的、内嵌依赖的完整 jar，沿用正式发布名
// （无 classifier）；原始 jar 退居 -thin 后缀，避免误部署缺 SnakeYAML 的瘦 jar。
// reobfJarJar 由 ForgeGradle 自动创建（输入为 jarJar 产物，assemble 自动依赖）
jarJar.enable()

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('jarJar') {
    archiveClassifier = ''
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 防 refmap 偶发丢失（TLM 同款）
tasks.compileJava {
    outputs.upToDateWhen { false }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : 'tlm-self-talk',
                'Specification-Version' : '1.4.0',
                'Implementation-Title'  : 'TLM Self-Talk',
                'Implementation-Version': '1.4.0',
                'MixinConfigs'          : 'maid_self_talk.mixins.json'
        ])
    }
}

// ===== 自检真实执行（issue #60 C13）：四个 main() 自检 + TLM 兼容自检挂到 check，
// gradle build / CI 自动运行，失败（非零退出或异常）即构建失败 =====
def selfCheckMains = ['EnvironmentContextTest', 'EnvironmentContextRendererTest',
                      'HistoryCoreTest', 'SelfTalkEventBufferTest', 'TlmMixinTargetTest',
                      'PrebuiltEntryCodecTest', 'SelfTalkReuseStoreTest', 'PlayerSettingsMigrationTest',
                      'RequestLifecycleTest', 'AutonomousChatHistoryLifecycleTest', 'LanguagePredicateTest']
selfCheckMains.each { name ->
    tasks.register("selfCheck${name}", JavaExec) {
        group = 'verification'
        description = "运行自检 main：com.maidmod.selftalk.${name}"
        // 并入 main 的 runtimeClasspath：neoforge 线 MDG 只把平台库（含 gson）接到 main，
        // forge 线为对称写法；HistoryCoreTest 运行需要的 gson 来自 Minecraft 依赖树
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = "com.maidmod.selftalk.${name}"
        jvmArgs '-Dfile.encoding=UTF-8'
    }
}
tasks.named('check') {
    dependsOn selfCheckMains.collect { "selfCheck${it}" }
}
